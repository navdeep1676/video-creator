# Development overrides: live reload for API + frontend (+ workers restart on .py change)
#
# Usage (from docker/):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Or from repo root:
#   ./scripts/dev-docker.sh

services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/app/app",
        "--reload-exclude",
        "*.pyc",
      ]
    environment:
      DOCKER: "true"
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://127.0.0.1:3000,http://localhost
    volumes:
      - ../backend:/app
      - mediadata:/data
    # Avoid anonymous .pyc noise on host
    develop:
      watch: []

  worker-tts:
    build:
      context: ../backend
      dockerfile: Dockerfile.worker.dev
    # Restart worker process when Python files under app/ change
    command:
      [
        "watchfiles",
        "--filter",
        "python",
        "celery -A app.workers.celery_app.celery_app worker -Q tts,default -c 2 -l info",
        "/app/app",
      ]
    volumes:
      - ../backend:/app
      - mediadata:/data

  worker-render:
    build:
      context: ../backend
      dockerfile: Dockerfile.worker.dev
    command:
      [
        "watchfiles",
        "--filter",
        "python",
        "celery -A app.workers.celery_app.celery_app worker -Q render -c 1 -l info",
        "/app/app",
      ]
    volumes:
      - ../backend:/app
      - mediadata:/data

  beat:
    build:
      context: ../backend
      dockerfile: Dockerfile.worker.dev
    command:
      [
        "watchfiles",
        "--filter",
        "python",
        "celery -A app.workers.celery_app.celery_app beat -l info",
        "/app/app",
      ]
    volumes:
      - ../backend:/app
      - mediadata:/data

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      DOCKER: "true"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_API_PROXY: http://api:8000
      VITE_HMR_CLIENT_PORT: "3000"
    # Replace base compose ports (3000:80) — lists merge by default and break the bind
    ports: !override
      - "3000:5173"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  frontend_node_modules:
