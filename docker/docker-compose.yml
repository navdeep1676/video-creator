services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: video
      POSTGRES_PASSWORD: video
      POSTGRES_DB: video_creator
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video -d video_creator"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://video:video@postgres:5432/video_creator
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /data
      SECRET_KEY: dev-compose-secret-change-me-please-32
      ENVIRONMENT: development
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      TTS_MOCK: ${TTS_MOCK:-true}
      CELERY_TASK_ALWAYS_EAGER: "false"
      # Wan2.1 I2V — set FAL_KEY (or REPLICATE_API_TOKEN) for real AI motion
      WAN_I2V_ENABLED: ${WAN_I2V_ENABLED:-true}
      WAN_I2V_MOCK: ${WAN_I2V_MOCK:-false}
      WAN_I2V_BACKEND: ${WAN_I2V_BACKEND:-auto}
      WAN_I2V_MODEL_ID: ${WAN_I2V_MODEL_ID:-Wan-AI/Wan2.1-I2V-14B-480P-Diffusers}
      WAN_I2V_RESOLUTION: ${WAN_I2V_RESOLUTION:-480p}
      WAN_T2V_ENABLED: ${WAN_T2V_ENABLED:-true}
      WAN_T2V_MOCK: ${WAN_T2V_MOCK:-false}
      WAN_T2V_BACKEND: ${WAN_T2V_BACKEND:-auto}
      WAN_T2V_MODEL_ID: ${WAN_T2V_MODEL_ID:-Wan-AI/Wan2.2-TI2V-5B-Diffusers}
      WAN_T2V_OFFLOAD: ${WAN_T2V_OFFLOAD:-true}
      WAN_T2V_DEVICE: ${WAN_T2V_DEVICE:-auto}
      # FAL_KEY / REPLICATE_API_TOKEN come from env_file (../.env) — do not blank them here
    volumes:
      - mediadata:/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-tts:
    build:
      context: ../backend
      dockerfile: Dockerfile.worker
    command: celery -A app.workers.celery_app.celery_app worker -Q tts,default,story-generation,music-generation,image-generation -c 1 -l info
    environment:
      DATABASE_URL: postgresql+psycopg://video:video@postgres:5432/video_creator
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /data
      SECRET_KEY: dev-compose-secret-change-me-please-32
      ENVIRONMENT: development
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      TTS_MOCK: ${TTS_MOCK:-true}
    volumes:
      - mediadata:/data
    depends_on:
      - api
      - redis
      - postgres

  worker-render:
    build:
      context: ../backend
      dockerfile: Dockerfile.worker
    command: celery -A app.workers.celery_app.celery_app worker -Q render -c 1 -l info
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://video:video@postgres:5432/video_creator
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /data
      SECRET_KEY: dev-compose-secret-change-me-please-32
      ENVIRONMENT: development
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      TTS_MOCK: ${TTS_MOCK:-true}
      WAN_I2V_ENABLED: ${WAN_I2V_ENABLED:-true}
      WAN_I2V_MOCK: ${WAN_I2V_MOCK:-false}
      WAN_I2V_BACKEND: ${WAN_I2V_BACKEND:-auto}
      WAN_I2V_MODEL_ID: ${WAN_I2V_MODEL_ID:-Wan-AI/Wan2.1-I2V-14B-480P-Diffusers}
      WAN_I2V_RESOLUTION: ${WAN_I2V_RESOLUTION:-480p}
      WAN_I2V_NUM_FRAMES: ${WAN_I2V_NUM_FRAMES:-81}
      WAN_I2V_OFFLOAD: ${WAN_I2V_OFFLOAD:-true}
      WAN_I2V_DEVICE: ${WAN_I2V_DEVICE:-auto}
      WAN_I2V_CKPT_DIR: ${WAN_I2V_CKPT_DIR:-}
      WAN_I2V_CLI_SCRIPT: ${WAN_I2V_CLI_SCRIPT:-}
      REPLICATE_WAN_MODEL: ${REPLICATE_WAN_MODEL:-wavespeedai/wan-2.1-i2v-480p}
      FAL_WAN_I2V_ENDPOINT: ${FAL_WAN_I2V_ENDPOINT:-fal-ai/wan-i2v}
      WAN_T2V_ENABLED: ${WAN_T2V_ENABLED:-true}
      WAN_T2V_MOCK: ${WAN_T2V_MOCK:-false}
      WAN_T2V_BACKEND: ${WAN_T2V_BACKEND:-auto}
      WAN_T2V_MODEL_ID: ${WAN_T2V_MODEL_ID:-Wan-AI/Wan2.2-TI2V-5B-Diffusers}
      WAN_T2V_WIDTH: ${WAN_T2V_WIDTH:-1280}
      WAN_T2V_HEIGHT: ${WAN_T2V_HEIGHT:-704}
      WAN_T2V_NUM_FRAMES: ${WAN_T2V_NUM_FRAMES:-81}
      WAN_T2V_GUIDANCE_SCALE: ${WAN_T2V_GUIDANCE_SCALE:-5}
      WAN_T2V_FLOW_SHIFT: ${WAN_T2V_FLOW_SHIFT:-5}
      WAN_T2V_NUM_INFERENCE_STEPS: ${WAN_T2V_NUM_INFERENCE_STEPS:-50}
      WAN_T2V_OFFLOAD: ${WAN_T2V_OFFLOAD:-true}
      WAN_T2V_DEVICE: ${WAN_T2V_DEVICE:-auto}
      WAN_T2V_CKPT_DIR: ${WAN_T2V_CKPT_DIR:-}
      WAN_T2V_CLI_SCRIPT: ${WAN_T2V_CLI_SCRIPT:-}
      # FAL_KEY / REPLICATE_API_TOKEN from env_file (../.env)
    volumes:
      - mediadata:/data
    depends_on:
      - api
      - redis
      - postgres

  beat:
    build:
      context: ../backend
      dockerfile: Dockerfile.worker
    command: celery -A app.workers.celery_app.celery_app beat -l info
    environment:
      DATABASE_URL: postgresql+psycopg://video:video@postgres:5432/video_creator
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /data
      SECRET_KEY: dev-compose-secret-change-me-please-32
    volumes:
      - mediadata:/data
    depends_on:
      - redis
      - postgres

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
  mediadata:
